version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: digitalwallet-db
    restart: always
    environment:
      MYSQL_DATABASE: digital_wallet
      MYSQL_ROOT_PASSWORD: 905980
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - digitalwallet-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "db", "-uroot", "-p905980"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: digitalwallet-backend
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: docker   # IMPORTANT!
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/digital_wallet
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 905980
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8088:8080"
    networks:
      - digitalwallet-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: digitalwallet-frontend
    restart: always
    depends_on:
      - backend
    environment:
      REACT_APP_API_URL: http://backend:8080
    ports:
      - "8089:8080"
    networks:
      - digitalwallet-net

volumes:
  db_data:

networks:
  digitalwallet-net:
    driver: bridge
